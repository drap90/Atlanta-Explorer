openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /ask-local:
    post:
      operationId: askLocal
      summary: Ask the Atlanta AI guide a question about this page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalQuestion"
      responses:
        "200":
          description: A short answer grounded in the guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAnswer"
        "400":
          description: Invalid question
        "429":
          description: Per-instance traffic limit or shared daily Gemini allowance reached
          headers:
            Retry-After:
              description: Seconds until retry; daily allowance resets at midnight UTC
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalLimitError"
        "503":
          description: The AI guide is temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    LocalLimitError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [DAILY_LIMIT_REACHED]
    LocalQuestion:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
        language:
          type: string
          enum: [en, es]
          default: en
    LocalAnswer:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

